const gradeOf=a=>a>=90?'A':a>=80?'B':a>=70?'C':a>=60?'D':a>=50?'E':'F';
const attOf=sid=>{const v=Object.entries(D.att).filter(([k])=>k.endsWith('|'+sid)).map(x=>x[1]);const p=v.filter(x=>x=='P').length,a=v.filter(x=>x=='A').length,l=v.filter(x=>x=='L').length;return{p,a,l,n:v.length,pct:v.length?Math.round((p+l)/v.length*100):0}};
const paidMonthly=sid=>D.pay.filter(p=>p.sid==sid&&p.type=='Monthly fee'&&p.status=='Paid').reduce((a,p)=>a+ +p.amount,0);
const balance=sid=>Math.max(0,D.cfg.fee*D.cfg.months-paidMonthly(sid));
function results(grade,name){const ex=D.exams.filter(e=>e.grade==grade&&e.name==name);const rows=sCls(grade).map(s=>{const sc=ex.map(e=>D.marks[e.id+'|'+s.id]),tot=sc.reduce((a,x)=>a+(+x||0),0),max=ex.reduce((a,e,i)=>a+(sc[i]!==undefined?+e.max:0),0),avg=max?Math.round(tot/max*1000)/10:0;return{s,sc,tot,avg,g:gradeOf(avg)}}).sort((a,b)=>b.tot-a.tot);rows.forEach((r,i)=>r.rank=i&&rows[i-1].tot==r.tot?rows[i-1].rank:i+1);return{ex,rows}}

<div class=card><h3>Attendance by grade</h3>${tbl(['Grade','Students','Avg attendance'],GR.map(g=>{const s=sCls(g),a=s.map(x=>attOf(x.id)).filter(x=>x.n);return[g,s.length,a.length?Math.round(a.reduce((t,x)=>t+x.pct,0)/a.length)+'%':'—']}))}</div>
<div class=card><h3>Average results by exam</h3>${tbl(['Grade','Exam','Class average'],[...new Set(D.exams.map(e=>e.grade+'|'+e.name))].map(k=>{const [g,n]=k.split('|'),r=results(g,n).rows.filter(x=>x.tot);return[g,esc(n),r.length?Math.round(r.reduce((t,x)=>t+x.avg,0)/r.length)+'%':'—']}))}</div>`};
V.settings=()=>`<h2>Settings</h2><div class=card><form onsubmit="event.preventDefault();const f=new FormData(this);D.cfg={name:f.get('name'),fee:+f.get('fee'),months:+f.get('months'),year:f.get('year')};save();render()"><label>School name<input name=name value="${esc(D.cfg.name)}"></label><label>Monthly fee (Birr)<input name=fee type=number value="${D.cfg.fee}"></label><label>Fee months per year<input name=months type=number value="${D.cfg.months}"></label><label>Academic year<input name=year value="${esc(D.cfg.year)}"></label><button class=btn>Save settings</button></form></div>
<div class=card><h3>User roles</h3>${tbl(['Role','Access'],[['Super Admin','Whole system'],['Admin','Students and school work'],['Teacher','Attendance, lessons, marks'],['Student','Own lessons, results, attendance'],['Parent','Own children'],['Accountant','Payments and receipts']])}</div>`;
const pend=()=>(window.USERS||[]).filter(u=>u.status=='pending').length;
const rej=id=>{const r=prompt('Reason for rejection (optional)');if(r!==null)FBuser(id,{status:'rejected',reason:r})};
V.approvals=()=>{const U=window.USERS||[],c={pending:'y',approved:'g',rejected:'r'};return`<h2>Account approvals</h2><div class=card>${tbl(['Name','Contact','Role','Link to','Status',''],U.slice().sort((a,b)=>(a.status=='pending'?0:1)-(b.status=='pending'?0:1)).map(u=>{const lk=u.role=='parent'?`<select onchange="FBuser('${u.id}',{link:this.value})">${opts(D.parents.map(p=>[p.id,p.name]),u.link,'— parent record —')}</select>`:u.role=='student'?`<select onchange="FBuser('${u.id}',{link:this.value})">${opts(D.students.map(p=>[p.id,p.name]),u.link,'— student —')}</select>`:'—';return[esc(u.name),esc(u.contact),`<select onchange="FBuser('${u.id}',{role:this.value})">${opts(Object.entries(ROLES),u.role)}</select>`,lk,tag(u.status,c[u.status]),`<button class="btn sm" onclick="FBuser('${u.id}',{status:'approved',reason:''})">Approve</button> <button class="btn bad sm" onclick="rej('${u.id}')">Reject</button>`]}))}</div><p style="color:var(--mut)">Parents: link the account to a parent record (Parents page). Students: link to the student record.</p>`};
function render(){if(mine()&&!kids().some(s=>s.id==D.me))D.me=kids()[0]?.id||'';$('#sn').textContent=D.cfg.name;$('#role').innerHTML=opts(Object.entries(ROLES),D.role);$('#role').style.display=window.REALROLE=='super'?'':'none';
$('#me').style.display=mine()?'':'none';$('#me').innerHTML=opts(kids().map(s=>[s.id,s.name]),D.me);
$('#nav').innerHTML=`<div class=logo><span class=lg>${ic('school',20)}</span><div>${esc(D.cfg.name)}<small>School Management System</small></div></div>`+PG.filter(p=>okPg(p[0])).map(p=>`<a class="${D.page==p[0]?'on':''}" onclick="go('${p[0]}')" tabindex=0 onkeydown="if(event.key=='Enter')go('${p[0]}')">${ic(p[2])}<span>${p[1]}</span>${p[0]=='approvals'&&pend()?` <span class=tag>${pend()}</span>`:''}</a>`).join('');
$('#v').className=LP!=D.page?'pg':'';LP=D.page;$('#v').innerHTML=V[D.page]();window.scrollTo(0,0)}
D=blank();;
</script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAnalytics}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,updateDoc,onSnapshot,collection}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getStorage,ref,uploadString,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
const app=initializeApp({apiKey:"AIzaSyCA5zkAk6kF3NA6BgfEXPHM3rGYwUW2cEM",authDomain:"madrasaa-daaru-salaam.firebaseapp.com",projectId:"madrasaa-daaru-salaam",storageBucket:"madrasaa-daaru-salaam.firebasestorage.app",messagingSenderId:"658907062192",appId:"1:658907062192:web:de8cbf42b94fa03a2fc075",measurementId:"G-GMME1MXLX4"});
try{getAnalytics(app)}catch(e){}
const auth=getAuth(app),db=getFirestore(app),sto=getStorage(app),STAFF=['super','admin','teacher','accountant'];
let reg=false,subs=[],cache={},loaded={},mode='login',prof=null;
const mail=v=>{v=v.trim();return v.includes('@')?v:v.replace(/\D/g,'')+'@phone.ds-school.app'};
const msg=(t,ok)=>{$('#amsg').textContent=t;$('#amsg').style.color=ok?'var(--ok)':'var(--bad)'};
function setMode(m){mode=m;const r=m=='reg';$('#nm').style.display=$('#rl').style.display=r?'':'none';$('#at').textContent=r?'Create account':'Login';$('#ab').textContent=r?'Register':'Login';$('#sw').textContent=r?'I have an account':'Create account';msg('')}
$('#sw').onclick=e=>{e.preventDefault();setMode(mode=='reg'?'login':'reg')};
$('#fp').onclick=async e=>{e.preventDefault();const c=$('#ac').value.trim();if(!c.includes('@'))return msg('Enter your email address first.');try{await sendPasswordResetEmail(auth,c);msg('Password reset email sent.',1)}catch(er){msg(er.message)}};
$('#af').onsubmit=async e=>{e.preventDefault();const c=$('#ac').value,p=$('#ap').value;
if(!c.trim())return msg('Please enter your email or phone number.');if(!p)return msg('Please enter your password.');
try{if(mode!='login'){const n=$('#an').value.trim();if(!n)return msg('Please enter your full name.');if(p.length<6)return msg('Password must be at least 6 characters.');
reg=true;const cr=await createUserWithEmailAndPassword(auth,mail(c),p);
await setDoc(doc(db,'users',cr.user.uid),{name:n,contact:c.trim(),role:$('#ar').value,status:'pending',link:'',reason:'',created:Date.now()});
await signOut(auth);reg=false;setMode('login');msg('Registration sent. Waiting for admin approval.',1)}
else await signInWithEmailAndPassword(auth,mail(c),p)}
catch(er){reg=false;const k=er.code||'';msg(k=='auth/user-not-found'?'Account not found.':k=='auth/email-already-in-use'?'This account already exists.':(k=='auth/invalid-credential'||k=='auth/wrong-password')?'Email/Phone Number or Password is incorrect.':er.message)}};
function stop(){subs.forEach(f=>f());subs=[];cache={};loaded={};prof=null}
onAuthStateChanged(auth,async u=>{if(reg)return;stop();document.body.classList.remove('in');if(!u)return;
try{const s=await getDoc(doc(db,'users',u.uid));
if(!s.exists()){await signOut(auth);return msg('Account not found.')}
const p=s.data();
if(p.status=='pending'){await signOut(auth);return msg('Waiting for admin approval.')}
if(p.status=='rejected'){await signOut(auth);return msg('Registration rejected.'+(p.reason?' Reason: '+p.reason:''))}
prof=p;startApp(p);document.body.classList.add('in');
DK.forEach(k=>subs.push(onSnapshot(doc(db,'school',k),s=>{loaded[k]=1;if(s.exists()){D[k]=s.data().v;cache[k]=JSON.stringify(D[k])}render()},er=>console.error(er))));
if(p.role=='super'||p.role=='admin')subs.push(onSnapshot(collection(db,'users'),s=>{window.USERS=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
render()}catch(er){msg(er.message)}});
window.FBsave=()=>{if(!prof||!STAFF.includes(prof.role))return;DK.forEach(k=>{if(!loaded[k])return;const s=JSON.stringify(D[k]??null);if(s!==cache[k]){cache[k]=s;setDoc(doc(db,'school',k),{v:JSON.parse(s)}).catch(e=>alert('Save failed: '+e.message))}})};
window.FBup=async d=>{try{const r=ref(sto,'uploads/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.jpg');await uploadString(r,d,'data_url');return await getDownloadURL(r)}catch(e){alert('Upload failed: '+e.message);return ''}};
window.FBout=()=>signOut(auth);
window.FBuser=(id,patch)=>updateDoc(doc(db,'users',id),patch).catch(e=>alert(e.message));
</script>
</body></html>
